<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>Login - WHIL Admin</title>
    <style>
        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20vh;
        }

        .login {
            width: 30vw;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>

</head>

<body>
    <h3>Login to the admin panel</h3>

    <form class="login" method="post" action="/api/admin/login">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <input type="submit" value="Login">
    </form>
</body>

</html>
